Syntax 3

SectionVerb {
	EnableSequence [
		# headphone path levels (same defaults as the upstream rx-macro init)
		cset "name='RX_RX0 Digital Volume' 96"
		cset "name='RX_RX1 Digital Volume' 96"
		cset "name='RX_COMP1 Switch' 0"
		cset "name='RX_COMP2 Switch' 0"
		# PulseAudio opens the PCM to probe it before enabling any device; a
		# front end with no back end routed fails that open with EINVAL, so
		# keep the speaker route on by default
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		# capture: route MultiMedia2 to the TX codec DMA once; the mic devices only switch the codec side
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
	]

	# PulseAudio switches ports as: disable old device, open the new sink,
	# enable the new device. A back end added to an already running stream
	# never starts, so route to the headphone back end here, before the
	# headphone sink is opened. (Headphones' DisableSequence does the same
	# for the speaker.)
	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		# LPASS RX macro
		cset "name='RX_HPH PWR Mode' LOHIFI"
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_MACRO RX1 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT1_1 MIX1 INP0' RX1"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		# WCD937x
		cset "name='HPHL_RDAC Switch' 1"
		cset "name='HPHR_RDAC Switch' 1"
		cset "name='HPHL Switch' 1"
		cset "name='HPHR Switch' 1"
		cset "name='RX HPH Mode' CLS_H_LOHIFI"
	]

	DisableSequence [
		cset "name='HPHL_RDAC Switch' 0"
		cset "name='HPHR_RDAC Switch' 0"
		cset "name='HPHL Switch' 0"
		cset "name='HPHR Switch' 0"
		cset "name='RX HPH Mode' CLS_H_INVALID"
		cset "name='RX_MACRO RX0 MUX' ZERO"
		cset "name='RX_MACRO RX1 MUX' ZERO"
		cset "name='RX INT0_1 MIX1 INP0' ZERO"
		cset "name='RX INT1_1 MIX1 INP0' ZERO"
		cset "name='RX INT0 DEM MUX' NORMAL_DSM_OUT"
		cset "name='RX INT1 DEM MUX' NORMAL_DSM_OUT"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic1" {
	Comment "Built-in microphone"

	ConflictingDevice [
		"Mic2"
	]

	EnableSequence [
		# WCD937x ADC1 (AMIC1), on SoundWire mic 0 as in the stock routing
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		# LPASS TX macro
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 110"
	]

	DisableSequence [
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
	}
}

SectionDevice."Mic2" {
	Comment "Headset microphone"

	ConflictingDevice [
		"Mic1"
	]

	EnableSequence [
		# WCD937x ADC2 from AMIC2, on SoundWire mic 4 as in the stock routing
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='ADC2 MUX' INP2"
		cset "name='ADC2 Switch' 1"
		# LPASS TX macro
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC4"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 110"
	]

	DisableSequence [
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='ADC2 Switch' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		JackControl "Mic Jack"
	}
}
