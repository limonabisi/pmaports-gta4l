[Unit]
# The ADSP's sensor process crashes the whole ADSP (and sound with it) when it
# finds no sensor registry; the registry comes from the tablet's own data.
ConditionDirectoryNotEmpty=/usr/share/qcom/sm6115/Samsung/gta4l/sensors/registry

[Service]
ExecStart=
ExecStart=/usr/bin/hexagonrpcd-gta4l -f /dev/fastrpc-adsp -d adsp -s -R /usr/share/qcom/sm6115/Samsung/gta4l
